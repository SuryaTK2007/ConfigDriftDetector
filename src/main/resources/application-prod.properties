server.port=8083
spring.application.name=hello-world-prod

# Database Configuration
spring.datasource.url=jdbc:postgresql://prod-db:5432/proddb
spring.datasource.username=prod_user
spring.datasource.password=prod_pass
spring.jpa.hibernate.ddl-auto=validate

# Logging
logging.level.com.example=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Feature Flags
app.features.new-ui=true
app.features.analytics=true

# External Services
app.external.api-url=https://api.example.com
app.external.timeout=10000

# Production specific
management.endpoints.web.exposure.include=health,info
